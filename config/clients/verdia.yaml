# Cliente FICTÍCIO de demonstração (vertical Ambiente, universo de tipo «tema»).
# Mostra um cliente cuja disputa é por atenção e clareza de mensagem, não por quota de mercado.
# Todas as entidades, números e datas são inventados para demonstração; nada é atribuído a empresas reais.

cliente:
  id: verdia
  nome: Verdia
  setor: Gestão de embalagens (cliente fictício)
  vertical: ambiente
  geo: PT
  idioma: pt-PT
  tipo_universo: tema   # "concorrencia" (comparar marcas) ou "tema" (disputa de atenção e clareza de mensagem)
  ficticio: true

universo:
  - {id: verdia,     nome: Verdia,      papel: Cliente,                                   prioridade: cliente, ficticia: true, meta_search_terms: ["Verdia"], meta_page_ids: []}
  - {id: ciclo-alvo, nome: Ciclo Alvo,  papel: Entidade gestora (fictícia),                prioridade: alta,    ficticia: true, meta_search_terms: ["Ciclo Alvo"], meta_page_ids: []}
  - {id: retornex,   nome: Retornex,    papel: Entidade gestora (fictícia),                prioridade: alta,    ficticia: true, meta_search_terms: ["Retornex"], meta_page_ids: []}
  - {id: reverso,    nome: Reverso,     papel: Sistema de depósito e reembolso (fictício), prioridade: alta,    ficticia: true, meta_search_terms: ["Reverso embalagens"], meta_page_ids: []}

# LIGAÇÃO[google-trends]: com um cliente real, os termos de cada cluster vêm da pesquisa da equipa (máximo 5 por cluster).
trends:
  geo: PT
  periodo: today 5-y
  clusters:
    reverso: ["máquinas reverso", "reverso garrafas", "depósito garrafas"]
    ecoponto: ["ecoponto amarelo", "ecoponto azul", "como separar o lixo", "reciclagem"]
    duvidas: ["caixa de pizza reciclar", "esferovite reciclar", "tetra pak reciclar"]
  apresentacao:        # nome e cor das séries mostradas na interface
    reverso:  {nome: "Reverso, devolução de garrafas", cor: 1}
    ecoponto: {nome: "Ecoponto e separação", cor: 0}
    duvidas:  {nome: "Dúvida «Reverso ou ecoponto?»", cor: 2}
  principais: [reverso, ecoponto, duvidas]

# LIGAÇÃO[news-rss]: «queries» alimenta o recolector; «temas» agrupa as pesquisas para o gráfico de conversa.
noticias:
  queries:
    - "Verdia embalagens"
    - "sistema Reverso embalagens"
    - "reciclagem embalagens Portugal"
    - "ecopontos recolha seletiva"
  temas:
    - {id: reverso,    nome: "Reverso",                queries: ["sistema Reverso embalagens"]}
    - {id: ecopontos,  nome: "Ecopontos e recolha",    queries: ["ecopontos recolha seletiva"]}
    - {id: entidades,  nome: "Entidades gestoras",     queries: ["Verdia embalagens"]}
    - {id: reciclagem, nome: "Reciclagem em Portugal", queries: ["reciclagem embalagens Portugal"]}

canais_observados: [meta, google_search, youtube, tiktok, tv, radio, ooh, imprensa]

limiares:
  pesquisas_variacao_vs_media_8s: 0.30
  anuncios_dias_ativo_min: 3
  noticias_meios_min: 3

# Dados internos do cliente: aparecem na interface só como «bloqueados» até haver parecer de Compliance e autorização.
dados_internos:
  assistente:
    nome: Utilização do assistente virtual do cliente
    descricao: Fora do âmbito até haver parecer de Compliance e autorização do cliente. Quando existir, fica fora do repositório.
    estado: Bloqueado
    pasta: data/raw/internal/assistente/

# ---- Contexto de mercado (DEMONSTRAÇÃO: valores inventados; um cliente real traria fonte e data de recolha) ----
contexto:
  indicadores:
    - {id: retoma, origem: demo, rotulo: Taxa de retoma de embalagens, valor: 57.0, formato: "%", decimais: 1, meta: 65, detalhe: "Meta: 65%"}
    - {id: recolha_seletiva, origem: demo, rotulo: Recolha seletiva no semestre, valor: 180000, formato: " t", detalhe: "+1,2% face ao ano anterior."}
    - {id: plastico_ecopontos, origem: demo, rotulo: Plástico nos ecopontos no semestre, valor: 31000, formato: " t", detalhe: "−5,4% face ao ano anterior.", variacao: -5.4}
    - {id: reverso_recolhidas, origem: demo, rotulo: Embalagens recolhidas pelo Reverso, valor: 42.0, formato: " M", decimais: 1, detalhe: "desde o arranque do sistema."}
  variacoes:          # recolha seletiva no semestre face ao ano anterior
    origem: demo
    titulo: "Recolha seletiva: o que mudou"
    descricao: "Variação do semestre face ao mesmo semestre do ano anterior."
    itens:
      - {rotulo: "Papel e cartão", valor: 3.1}
      - {rotulo: "Recolha seletiva total", valor: 1.2}
      - {rotulo: "Plástico nos ecopontos", valor: -5.4}

# ---- Eventos que marcam as séries (aparecem anotados nos gráficos; fictícios) ----
eventos:
  - {data: 2026-04-10, titulo: "Reverso arranca (10 abr)"}
  - {data: 2026-08-10, titulo: "Reverso generalizado (10 ago)"}

# ---- Agenda (fictícia) ----
agenda:
  - {data: "10 abr 2026", texto: "O sistema Reverso arranca: devolução de garrafas de plástico e latas com reembolso.", estado: passado, origem: demo}
  - {data: "10 ago 2026", texto: "O Reverso passa a abranger todas as embalagens de bebida elegíveis.", estado: passado, origem: demo}
  - {data: "1 out 2026", texto: "Hoje. A campanha escolar da Verdia regressa às escolas.", estado: hoje, origem: demo}
  - {data: "Novembro e dezembro", texto: "Possível pico de dúvidas de separação no Natal.", estado: futuro, origem: estimado, metodo: "sazonalidade assumida; a validar com 5 anos de Google Trends"}

# ---- Sazonalidade esperada (ESTIMADO: perfil assumido, a validar com 5 anos de Google Trends) ----
sazonalidade:
  metodo: "perfil sazonal assumido (verão e Natal mais altos); a validar com 5 anos de Google Trends"
  indice_mensal: [88, 86, 92, 95, 98, 108, 110, 104, 100, 96, 112, 126]

# ---- Sinais: a regra (gatilho) é genérica; o conteúdo é deste cliente. ----
# gatilhos: procura_variacao (série) · indicador (id) · agenda (sem cálculo). Os textos aceitam {variacao} e {limiar} (em %).
sinais_modelo:
  - id: s1
    categoria: Procura
    gatilho: {tipo: procura_variacao, serie: duvidas}
    bloco: procura
    titulo: "A dúvida «Reverso ou ecoponto?» sobe {variacao}% face à média de 8 semanas"
    sinal: "Interesse de pesquisa {variacao}% acima da média das 8 semanas anteriores. O limiar é {limiar}%."
    leitura: "Com o Reverso, garrafas e latas elegíveis têm dois destinos possíveis. A dúvida «onde ponho isto?» pode ter subido."
    hipotese: true
    serie: {tipo: procura, id: duvidas}
    pista:
      titulo: "Ativar o assistente virtual com a mensagem «ecoponto ou Reverso?»"
      sinal: "Interesse de pesquisa em «Reverso ou ecoponto?» {variacao}% acima da média das 8 semanas anteriores."
      leitura: "Com o Reverso, garrafas e latas elegíveis passam a ter dois destinos possíveis. A dúvida «onde ponho isto?» pode ter subido desde o arranque e desde a generalização."
      acao: "Pesquisa e Meta com uma mensagem de esclarecimento que leva ao assistente virtual, durante as próximas duas semanas."
      para: Performance
      confianca: "Confiança média: depende de dados reais de pesquisa."
  - id: s2
    categoria: Contexto
    gatilho: {tipo: indicador, indicador: plastico_ecopontos}
    em_observacao: true
    bloco: ctx_plastico_ecopontos
    titulo: "O plástico recolhido nos ecopontos caiu 5,4% no semestre"
    sinal: "Plástico: −5,4%, 31 000 t. Recolha seletiva total: +1,2%, 180 000 t."
    leitura: "Parte da queda pode ser desvio de garrafas para o Reverso, e não menos separação. Por testar."
    hipotese: true
    pista:
      titulo: "Dar contexto à queda do plástico nos ecopontos"
      sinal: "Plástico recolhido nos ecopontos: −5,4% no semestre, 31 000 t."
      leitura: "Parte da queda pode ser desvio de garrafas para o Reverso, e não menos separação. Por testar."
      acao: "Conteúdo editorial que explique que separar continua a contar, só que com outro destino para garrafas e latas. Quatro semanas."
      para: Brand
      confianca: "Confiança baixa até validar com dados do sistema de depósito."
  - id: s3
    categoria: Agenda
    gatilho: {tipo: agenda}
    em_observacao: true
    bloco: sazonalidade
    titulo: "O Natal aproxima-se, e com ele o pico de dúvidas de separação"
    sinal: "Os picos sazonais tendem a trazer mais dúvidas de separação."
    leitura: "Ativar o assistente virtual antes do pico dá resposta quando a dúvida aparece, e não depois."
    hipotese: true
    pista:
      titulo: "Antecipar o pico de dúvidas do Natal"
      sinal: "Os picos sazonais (Natal, verão, regresso às aulas) tendem a trazer mais dúvidas de separação."
      leitura: "Ativar o assistente virtual antes do pico dá resposta quando a dúvida aparece, e não depois."
      acao: "Calendarizar a ativação do assistente virtual a partir de novembro, em Meta e YouTube."
      para: Performance
      confianca: "Confiança média: depende de validar o histórico."

# ---- O que se mostra na Visão geral (catálogo de métricas em docs/08-especificacao-ux.md) ----
kpis:
  - {metrica: procura, serie: duvidas, rotulo: "Procura: «Reverso ou ecoponto?»"}
  - {metrica: noticias_total, rotulo: "Artigos nas notícias"}
  - {metrica: indicador, id: retoma}
  - {metrica: indicador, id: plastico_ecopontos}

