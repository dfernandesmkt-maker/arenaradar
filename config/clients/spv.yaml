# Arena Radar — configuração do cliente Sociedade Ponto Verde (cliente EXEMPLO; o Radar funciona para qualquer cliente).
# Tudo o que é específico do cliente vive aqui. O código não tem nada «hardcoded» sobre a SPV.
# Estrutura geral e campos: config/clients/_template.yaml e docs/08-especificacao-ux.md (secção 7).

cliente:
  id: spv
  nome: Sociedade Ponto Verde
  setor: Gestão de resíduos de embalagens (SIGRE)
  vertical: ambiente
  geo: PT
  idioma: pt-PT
  tipo_universo: tema   # "concorrencia" (comparar marcas) ou "tema" (disputa de atenção e clareza de mensagem)
  ficticio: false

universo:
  - id: spv
    nome: Sociedade Ponto Verde
    papel: Cliente
    prioridade: cliente
    meta_search_terms: ["Ponto Verde"]
    meta_page_ids: []          # a preencher após confirmar na Ad Library
  - id: novo-verde
    nome: Novo Verde
    papel: Entidade gestora do sistema de embalagens
    prioridade: alta
    meta_search_terms: ["Novo Verde"]
    meta_page_ids: []
  - id: electrao
    nome: Electrão
    papel: Entidade gestora do sistema de embalagens
    prioridade: alta
    meta_search_terms: ["Electrão"]
    meta_page_ids: []
  - id: sdr-volta
    nome: SDR Portugal, sistema Volta
    papel: Sistema de depósito e reembolso
    prioridade: alta
    meta_search_terms: ["Volta embalagens", "SDR Portugal"]
    meta_page_ids: []

# Google Trends: máximo 5 termos por cluster (limite da ferramenta).
# LIGAÇÃO[google-trends]: o recolector grava um índice por termo; o build agrega por cluster (média dos termos).
trends:
  geo: PT
  periodo: today 5-y
  clusters:
    volta: ["máquinas volta", "volta garrafas", "depósito garrafas", "10 cêntimos garrafas"]
    ecoponto: ["ecoponto amarelo", "ecoponto azul", "ecoponto verde", "como separar o lixo", "reciclagem"]
    duvidas: ["caixa de pizza reciclar", "esferovite reciclar", "tetra pak reciclar", "guardanapos reciclar"]
    marcas: ["ponto verde", "novo verde", "electrão"]
  apresentacao:        # nome e cor das séries mostradas na interface
    volta:    {nome: "Volta, devolução de garrafas", cor: 1}
    ecoponto: {nome: "Ecoponto e separação", cor: 0}
    duvidas:  {nome: "Dúvida «Volta ou ecoponto?»", cor: 2}
  principais: [volta, ecoponto, duvidas]

# LIGAÇÃO[news-rss]: «queries» alimenta o recolector; «temas» agrupa as pesquisas para o gráfico de conversa.
noticias:
  queries:
    - "Sociedade Ponto Verde"
    - "Novo Verde reciclagem"
    - "Electrão embalagens"
    - "sistema Volta embalagens"
    - "reciclagem embalagens Portugal"
    - "ecopontos recolha seletiva"
  temas:
    - {id: volta,      nome: "Volta",                  queries: ["sistema Volta embalagens"]}
    - {id: ecopontos,  nome: "Ecopontos e recolha",    queries: ["ecopontos recolha seletiva"]}
    - {id: entidades,  nome: "Entidades gestoras",     queries: ["Sociedade Ponto Verde", "Novo Verde reciclagem", "Electrão embalagens"]}
    - {id: reciclagem, nome: "Reciclagem em Portugal", queries: ["reciclagem embalagens Portugal"]}

canais_observados: [meta, google_search, youtube, tiktok, tv, radio, ooh, imprensa]

limiares:
  pesquisas_variacao_vs_media_8s: 0.30
  anuncios_dias_ativo_min: 3
  noticias_meios_min: 3
  elo_variacao_semanal: 0.25

# Dados internos do cliente: aparecem na interface só como «bloqueados» até haver parecer de Compliance e autorização.
dados_internos:
  elo:
    nome: Utilização do chatbot ELO
    descricao: Fora do âmbito até haver parecer de Compliance e autorização do cliente. Quando existir, fica fora do repositório.
    estado: Bloqueado
    pasta: data/raw/internal/elo/

# ---- Contexto de mercado (dados REAIS, com fonte e data de recolha) ----
contexto:
  indicadores:
    - id: retoma_2025
      rotulo: Retoma de embalagens em 2025
      valor: 60.5
      formato: "%"
      decimais: 1
      meta: 65
      detalhe: "Meta europeia: 65%"
      fonte: "Diário de Viseu (Lusa), 14/07/2026"
      data_recolha: 2026-09-23
    - id: recolha_seletiva_s1
      rotulo: "Recolha seletiva, 1.º semestre 2026"
      valor: 233065
      formato: " t"
      detalhe: "+0,9% face ao ano anterior. Papel e cartão: +4,8%."
      fonte: "Diário de Viseu (Lusa), 14/07/2026"
      data_recolha: 2026-09-23
    - id: plastico_ecopontos
      rotulo: "Plástico nos ecopontos, 1.º semestre"
      valor: 40031
      formato: " t"
      detalhe: "−6,6% face ao ano anterior."
      variacao: -6.6
      fonte: "Diário de Viseu (Lusa), 14/07/2026"
      data_recolha: 2026-09-23
    - id: volta_recolhidas
      rotulo: Embalagens recolhidas pela Volta
      valor: 55.5
      formato: " M"
      decimais: 1
      detalhe: "entre 10 de abril e 6 de julho. Universo anual: cerca de 2,1 mil milhões."
      fonte: "Renascença, 20/07/2026"
      data_recolha: 2026-09-23
  variacoes:          # recolha seletiva, 1.º semestre de 2026 face a 2025
    fonte: "Diário de Viseu (Lusa), 14/07/2026"
    data_recolha: 2026-09-23
    titulo: "Recolha seletiva: o que mudou"
    descricao: "Variação do 1.º semestre de 2026 face ao 1.º semestre de 2025."
    itens:
      - {rotulo: "Papel e cartão", valor: 4.8}
      - {rotulo: "Recolha seletiva total", valor: 0.9}
      - {rotulo: "Plástico nos ecopontos", valor: -6.6}

# ---- Eventos que marcam as séries (aparecem anotados nos gráficos) ----
eventos:
  - {data: 2026-04-10, titulo: "Volta arranca (10 abr)", fonte: "Observador, 08/04/2026; DN, 10/04/2026"}
  - {data: 2026-08-10, titulo: "Volta generalizada (10 ago)", fonte: "Cuatrecasas, 05/05/2026"}

# ---- Agenda ----
agenda:
  - {data: "10 abr 2026", texto: "O sistema Volta arranca: 0,10 € por garrafa de plástico ou lata até 3 litros.", estado: passado, origem: real, fonte: "Observador, 08/04/2026; DN, 10/04/2026"}
  - {data: "10 ago 2026", texto: "A Volta passa a abranger todas as embalagens de bebida de uso único elegíveis.", estado: passado, origem: real, fonte: "Cuatrecasas, 05/05/2026"}
  - {data: "1 out 2026", texto: "Hoje. A Academia Ponto Verde regressa às escolas no ano letivo 2026/2027.", estado: hoje, origem: real, fonte: "pontoverde.pt"}
  - {data: "Novembro e dezembro", texto: "Possível pico de dúvidas de separação no Natal.", estado: futuro, origem: estimado, metodo: "sazonalidade assumida; a validar com 5 anos de Google Trends"}

# ---- Sazonalidade esperada (ESTIMADO: perfil assumido, a validar com 5 anos de Google Trends) ----
sazonalidade:
  metodo: "perfil sazonal assumido (verão e Natal mais altos); a validar com 5 anos de Google Trends"
  indice_mensal: [88, 86, 92, 95, 98, 108, 110, 104, 100, 96, 112, 126]

# ---- Sinais: a regra (gatilho) é genérica; o conteúdo é deste cliente. ----
# gatilhos: procura_variacao (série) · indicador (id) · agenda (sem cálculo)
# Os textos aceitam {variacao}, {limiar} (em %).
sinais_modelo:
  - id: s1
    categoria: Procura
    gatilho: {tipo: procura_variacao, serie: duvidas}
    bloco: procura
    titulo: "A dúvida «Volta ou ecoponto?» sobe {variacao}% face à média de 8 semanas"
    sinal: "Interesse de pesquisa {variacao}% acima da média das 8 semanas anteriores. O limiar é {limiar}%."
    leitura: "Com a Volta, garrafas e latas elegíveis têm dois destinos possíveis. A dúvida «onde ponho isto?» pode ter subido."
    hipotese: true
    serie: {tipo: procura, id: duvidas}
    pista:
      titulo: "Ativar o ELO com a mensagem «ecoponto ou Volta?»"
      sinal: "Interesse de pesquisa em «Volta ou ecoponto?» {variacao}% acima da média das 8 semanas anteriores."
      leitura: "Com a Volta, garrafas e latas elegíveis passam a ter dois destinos possíveis. A dúvida «onde ponho isto?» pode ter subido desde 10 de abril e desde 10 de agosto."
      acao: "Search e Meta com uma mensagem de esclarecimento que leva ao ELO, durante as próximas duas semanas."
      para: Performance
      confianca: "Confiança média, depende de dados reais de pesquisa."
  - id: s2
    categoria: Contexto
    gatilho: {tipo: indicador, indicador: plastico_ecopontos}
    em_observacao: true
    bloco: ctx_plastico_ecopontos
    titulo: "O plástico recolhido nos ecopontos caiu 6,6% no 1.º semestre"
    sinal: "Plástico: −6,6%, 40 031 t. Recolha seletiva total: +0,9%, 233 065 t."
    leitura: "Parte da queda pode ser desvio de garrafas para a Volta, que recolheu cerca de 55,5 milhões de embalagens entre 10 de abril e 6 de julho. Por testar."
    hipotese: true
    pista:
      titulo: "Dar contexto à queda do plástico nos ecopontos"
      sinal: "Plástico recolhido nos ecopontos: −6,6% no 1.º semestre de 2026, 40 031 t."
      leitura: "Parte da queda pode ser desvio de garrafas para a Volta (55,5 milhões de embalagens entre 10 de abril e 6 de julho), e não menos separação. Por testar."
      acao: "Conteúdo editorial que explique que separar continua a contar, só que com outro destino para garrafas e latas. Quatro semanas."
      para: Brand
      confianca: "Confiança baixa até validar com dados da Volta."
  - id: s3
    categoria: Agenda
    gatilho: {tipo: agenda}
    em_observacao: true
    bloco: sazonalidade
    titulo: "O Natal aproxima-se, e com ele o pico de dúvidas de separação"
    sinal: "Os picos sazonais tendem a trazer mais dúvidas de separação."
    leitura: "Ativar o ELO antes do pico dá resposta quando a dúvida aparece, e não depois."
    hipotese: true
    pista:
      titulo: "Antecipar o pico de dúvidas do Natal"
      sinal: "Os picos sazonais (Natal, verão, regresso às aulas) tendem a trazer mais dúvidas de separação."
      leitura: "Ativar o ELO antes do pico dá resposta quando a dúvida aparece, e não depois."
      acao: "Calendarizar a ativação do ELO a partir de novembro, em Meta e YouTube."
      para: Performance
      confianca: "Confiança média-baixa, depende de validar o histórico."

# ---- O que se mostra na Visão geral (catálogo de métricas em docs/08-especificacao-ux.md) ----
kpis:
  - {metrica: procura, serie: duvidas, rotulo: "Procura: «Volta ou ecoponto?»"}
  - {metrica: noticias_total, rotulo: "Artigos nas notícias"}
  - {metrica: indicador, id: retoma_2025}
  - {metrica: indicador, id: plastico_ecopontos}

