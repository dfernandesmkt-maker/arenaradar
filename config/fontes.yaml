# Biblioteca de fontes de dados (módulos). Mostrada em «Fontes de dados».
# O «id» é o mesmo usado nos comentários LIGAÇÃO[<id>] do código (ver docs/09-pontos-de-ligacao.md).
# estado: ok (pronto ou ativo) · wip (simulado na demonstração) · lk (depende de decisão)
fontes:
  - id: meta-ad-library
    nome: "Meta Ad Library"
    tipo: "Anúncios"
    como: "API (Graph)"
    estado: "wip"
    estado_rotulo: "Simulado na demonstração"
    csv: true
    descricao: "Anúncios entregues na UE, incluindo comerciais: texto, datas, plataformas e alcance na UE. Não devolve investimento nem segmentação em anúncios comerciais."
    cobertura: "Anúncios entregues na UE; os comerciais ficam cerca de 1 ano"
    regime: "Fonte pública oficial. O token exige identidade confirmada; aprovação de IT e Compliance"
    responsavel: "Radar · scripts/collect_meta_ads.py"
    campos: ["page_name", "ad_creative_bodies", "ad_delivery_start_time", "ad_delivery_stop_time", "publisher_platforms", "eu_total_reach", "ad_snapshot_url"]

  - id: google-ads-transparency
    nome: "Google Ads Transparency Center"
    tipo: "Anúncios"
    como: "Consulta manual ou CSV"
    estado: "wip"
    estado_rotulo: "Manual + importador"
    csv: true
    descricao: "Anúncios por anunciante em pesquisa, YouTube e display, com datas e formatos. Não tem API oficial."
    cobertura: "Por anunciante e região"
    regime: "Fonte pública. Recolha manual até haver forma aprovada de automatizar"
    responsavel: "Equipa · manual"
    campos: ["anunciante", "formato", "plataforma", "primeira_vez_visto", "ultima_vez_visto", "regiao"]

  - id: tiktok-ad-library
    nome: "TikTok Ad Library (DSA)"
    tipo: "Anúncios"
    como: "Consulta manual ou API de investigação"
    estado: "lk"
    estado_rotulo: "Por definir"
    csv: true
    descricao: "Anúncios TikTok entregues na UE. O acesso por API exige candidatura."
    cobertura: "UE"
    regime: "Fonte pública. Aprovação de IT e Compliance"
    responsavel: "Equipa · IT"
    campos: ["anunciante", "texto", "data_inicio", "data_fim", "regiao"]

  - id: google-trends
    nome: "Google Trends"
    tipo: "Procura"
    como: "API em alpha ou CSV manual"
    estado: "wip"
    estado_rotulo: "Simulado na demonstração"
    csv: false
    descricao: "Interesse de pesquisa relativo (0 a 100) por tema e região. Alimenta as curvas de procura e dúvidas."
    cobertura: "Portugal e regiões"
    regime: "Fonte pública. API oficial em alpha, com candidatura"
    responsavel: "Radar · scripts/collect_trends.py"
    campos: ["termo", "semana", "interesse", "regiao"]

  - id: news-rss
    nome: "Notícias (Google News RSS)"
    tipo: "Conversa pública"
    como: "RSS"
    estado: "ok"
    estado_rotulo: "Pronto a ligar"
    csv: false
    descricao: "Notícias por pesquisa em Portugal. Boa para deteção de temas; não é exaustiva."
    cobertura: "Imprensa online em Portugal"
    regime: "Fonte pública, sem chave. Termos de uso a confirmar"
    responsavel: "Radar · scripts/collect_news.py"
    campos: ["titulo", "fonte", "data", "url", "termo"]

  - id: marktest-adcheck
    nome: "Ferramenta de ad intelligence licenciada"
    tipo: "Anúncios e investimento"
    como: "API ou exportação, a definir"
    estado: "lk"
    estado_rotulo: "Por definir"
    csv: true
    descricao: "Módulo reservado para investimento estimado por canal e criativos multiplataforma, com licença do grupo. Um exemplo de fornecedor já listado no dossier é a Marktest AdCheck."
    cobertura: "A definir com o fornecedor"
    regime: "Fonte licenciada. Depende de decisão de compra e de aprovação de IT e Compliance"
    responsavel: "Direção · IT"
    campos: ["anunciante", "canal", "investimento_estimado", "impressoes_estimadas", "criativo_url"]

  - id: monitorizacao-offline
    nome: "Monitorização de investimento e inserções"
    tipo: "TV, rádio, exterior e digital"
    como: "Exportação do fornecedor"
    estado: "lk"
    estado_rotulo: "Por definir"
    csv: true
    descricao: "Inserções e investimento em meios tradicionais e digitais, para completar a presença por canal."
    cobertura: "A definir com o fornecedor"
    regime: "Fonte licenciada. A definir pela Direção e por IT"
    responsavel: "Direção · IT"
    campos: ["anunciante", "meio", "data", "inserções", "investimento_estimado"]

  - id: google-ads-auction
    nome: "Google Ads, informações do leilão"
    tipo: "Pesquisa · dados do cliente"
    como: "API Google Ads, conta do cliente"
    estado: "lk"
    estado_rotulo: "Por confirmar"
    csv: false
    descricao: "Quota de impressões, sobreposição e posição relativa face aos concorrentes que disputam os mesmos leilões."
    cobertura: "Contas de clientes geridas pela Arena"
    regime: "Dados internos do cliente. Exige autorização do cliente e parecer de Compliance"
    responsavel: "Performance · Compliance"
    campos: ["quota_impressoes", "taxa_sobreposicao", "posicao_acima", "quota_topo_pagina"]

  - id: importador-csv
    nome: "Importador CSV"
    tipo: "Qualquer fonte"
    como: "Ficheiro"
    estado: "ok"
    estado_rotulo: "Ativo na demonstração"
    csv: false
    descricao: "Recebe exportações de qualquer fonte e valida a proveniência de cada linha antes de entrar no Radar."
    cobertura: "Qualquer"
    regime: "Regra de ouro: sem origem, fonte e data, a linha não entra"
    responsavel: "Equipa"
    campos: ["marca", "plataforma", "formato", "data_inicio", "texto", "origem", "fonte", "data_recolha", "metodo"]

  - id: elo
    nome: "Utilização do chatbot ELO"
    tipo: "Dados internos do cliente"
    como: "—"
    estado: "lk"
    estado_rotulo: "Bloqueado"
    csv: false
    descricao: "Fora do âmbito até haver parecer de Compliance e autorização do cliente. Nunca entra no repositório."
    cobertura: "—"
    regime: "Bloqueado"
    responsavel: "Compliance"
    campos: []
