# Roteiro da apresentação (modo «Apresentar»). Cada passo abre um ecrã e mostra uma nota para quem apresenta.
# É configuração, não código: para mudar a história da demonstração, edita este ficheiro e volta a gerar o protótipo.
# rota: «<cliente>/<página>[/<separador>]» ou «agencia/<torre|fontes>»; acrescentar «?v=cliente» abre a vista do cliente.
# preparar (opcional): demo-pistas = aceita a 1.ª pista, marca-a para o cliente e escolhe 2 cartões
#                      demo-publicar = publica (só nesta demonstração)
roteiro:
  - id: torre
    titulo: Todos os clientes num só sítio
    rota: agencia/torre
    nota: "A Torre de controlo junta os clientes por vertical. A fila de decisões põe primeiro as pistas da tua função e depois as de sinal mais forte: a plataforma sugere a ordem, a equipa decide."
  - id: visao
    titulo: O primeiro ecrã diz logo o que mudou
    rota: lumio/visao
    nota: "Cada cartão traz o número, o limiar, a janela de cálculo e uma pista; «Porquê?» mostra a regra e os números por trás. A faixa «Desde a semana passada» diz o que é novo. O selo no topo diz de onde vêm os dados."
  - id: mercado
    titulo: A concorrência de relance
    rota: lumio/mercado/voz
    nota: "Quota de voz por marca. Mexe na semana e o ranking refaz-se. O conjunto competitivo é da equipa: o Radar só sugere."
  - id: marca
    titulo: Cada marca por dentro
    rota: lumio/marca/aurea
    nota: "A ficha de uma marca junta campanhas, formatos, mensagens e criativos. Dá para a comparar com outra marca e acrescentar o que importa ao briefing."
  - id: criativos
    titulo: O que a concorrência põe no ar
    rota: lumio/criativos
    nota: "Criativos, formatos e mensagens. Com a Meta Ad Library ligada, aqui entram os anúncios reais."
  - id: tema
    titulo: O mesmo produto noutro tipo de cliente
    rota: verdia/visao
    nota: "A Verdia, cliente fictício de tema, não compete por quota: disputa atenção e clareza de mensagem. O ecrã tem a mesma estrutura, com blocos próprios deste tipo de cliente."
  - id: procura
    titulo: Procura e notícias
    rota: verdia/procura
    nota: "O selo no topo diz de onde vêm os dados. Clica nele para ver o detalhe por bloco, ou passa o cursor num número para ver a origem."
  - id: pistas
    titulo: A equipa decide
    rota: lumio/acoes/pistas
    nota: "Aceitar, ajustar ou descartar, e atribuir a Performance, Brand ou Account. Cada pista mostra a cadeia sinal, leitura e ação, e o separador Alertas avisa só do que é material."
    preparar: demo-pistas
  - id: publicar
    titulo: Para o cliente só sai o que a equipa publicar
    rota: lumio/relatorios/publicar
    nota: "A equipa escolhe páginas, cartões e pistas aceites e vê, ao lado, o que o cliente verá. O que está publicado só muda quando a equipa volta a publicar."
  - id: cliente
    titulo: A vista do cliente
    rota: lumio/visao?v=cliente
    nota: "Sem limiares, hipóteses nem atribuições internas, e assinado pela Arena. A entrega real ao cliente decide-se com IT e Compliance."
    preparar: demo-publicar
  - id: fontes
    titulo: Ligar fontes sem mudar a interface
    rota: agencia/fontes
    nota: "Cada fonte é um módulo. Ao ligar uma fonte real, o selo da página passa de Demonstração a Real, sem mexer na interface."
