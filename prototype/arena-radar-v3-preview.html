const CSVHEAD="marca,plataforma,formato,data_inicio,texto,origem,fonte,data_recolha,metodo";
const CSVEX=CSVHEAD+`
Marca Exemplo,Meta,Vídeo,2026-09-14,"Exemplo de texto de anúncio",demo,,,
Marca Exemplo,Google,Texto,2026-09-20,"Exemplo de anúncio de pesquisa",demo,,,
Marca Exemplo,TikTok,Vídeo,2026-09-22,"Linha com erro: origem real sem fonte",real,,,
Empresa Terceira,Meta,Imagem,2026-09-01,"Linha com erro: demo atribuído a terceiro",demo,,,
Marca Exemplo,Rádio,Áudio,2026-09-02,"Linha com erro: plataforma fora da lista",demo,,,
Marca Exemplo,YouTube,Vídeo,2026-09-25,"Exemplo estimado com método",estimado,,,"Contagem manual de criativos visíveis em 25/09/2026"`;
function parseCSV(t){t=t.replace(/^﻿/,"");const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===","||c===";"){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);f="";if(row.some(x=>x!==""))rows.push(row);row=[]}else f+=c}row.push(f);if(row.some(x=>x!==""))rows.push(row);return rows}
let IMPRES=null,IMPCLI=null;
const targetId=()=>IMPCLI||CID;
function withClient(id,fn){const prev=D&&D.cliente.id;setClient(id);const r=fn();if(prev&&prev!==id)setClient(prev);return r}
function validateCSV(text,name,cid){return withClient(cid,()=>{
 const rows=parseCSV(text);if(rows.length<2)return{name,cid,err:[{l:1,f:"ficheiro",m:"O ficheiro está vazio ou só tem cabeçalho."}],ok:[],total:0};
 const head=rows[0].map(h=>h.trim().toLowerCase()),need=["marca","plataforma","formato","data_inicio","texto","origem"],miss=need.filter(c=>!head.includes(c));
 if(miss.length)return{name,cid,err:[{l:1,f:"cabeçalho",m:"Faltam as colunas: "+miss.join(", ")+"."}],ok:[],total:rows.length-1};
 const ix=k=>head.indexOf(k),err=[],ok=[],pm=Object.fromEntries(PL.map(p=>[p.toLowerCase(),p])),fm=Object.fromEntries(FM.map(f=>[f.toLowerCase(),f])),fict=new Set(D.entidades.filter(e=>e.ficticia).map(e=>slug(e.nome)).concat(["marca-exemplo"]));
 fm["video"]="Vídeo";
 rows.slice(1).forEach((r,k)=>{const l=k+2,g=c=>(ix(c)>=0?(r[ix(c)]||""):"").trim(),bad=[];
  const marca=g("marca"),pl=pm[g("plataforma").toLowerCase()],f=fm[g("formato").toLowerCase()],dt=g("data_inicio"),o=g("origem").toLowerCase(),txt=g("texto");
  if(!marca)bad.push(["marca","Falta a marca."]);
  if(pl===undefined)bad.push(["plataforma","«"+g("plataforma")+"» não está na lista: "+PL.join(", ")+"."]);
  if(f===undefined)bad.push(["formato","«"+g("formato")+"» não está na lista: "+FM.join(", ")+"."]);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)||isNaN(new Date(dt)))bad.push(["data_inicio","Usa o formato AAAA-MM-DD."]);
  if(!txt)bad.push(["texto","Falta o texto do anúncio."]);
  if(!["real","estimado","demo"].includes(o))bad.push(["origem","Tem de ser real, estimado ou demo."]);
  else{if(o==="real"&&(!g("fonte")||!g("data_recolha")))bad.push(["origem","Dado real exige fonte e data_recolha (regra de ouro 2)."]);
   if(o==="estimado"&&!g("metodo"))bad.push(["origem","Dado estimado exige o método (regra de ouro 3)."]);
   if(o==="demo"&&marca&&!fict.has(slug(marca)))bad.push(["origem","Dado demo não pode ser atribuído a uma entidade terceira real (regra de ouro 4)."])}
  if(bad.length)bad.forEach(b=>err.push({l,f:b[0],m:b[1]}));
  else{const en=D.entidades.find(e=>slug(e.nome)===slug(marca));ok.push({id:"imp-"+Date.now()+"-"+ok.length,imp:true,marca:en?en.id:slug(marca),bn:marca,plataforma:pl,formato:f,data_inicio:dt,data_fim:null,texto:txt,origem:o,fonte:g("fonte")||undefined,metodo:g("metodo")||undefined})}});
 return{name,cid,err,ok,total:rows.length-1}})}
function renderImp(res){IMPRES=res;const box=$("#impres");if(!box)return;
 if(!res){box.innerHTML=`<div class="lockcard"><svg class="ic" style="width:22px;height:22px"><use href="#i-plug"/></svg><div><b style="color:var(--text);font-weight:600">Ainda sem ficheiro</b><br>O Radar valida cada linha antes de a aceitar: plataforma e formato conhecidos, data válida, e origem com a fonte, a data de recolha ou o método que lhe correspondem.</div></div>`;return}
 const {ok,err,total,name}=res,bad=new Set(err.map(x=>x.l)).size;
 box.innerHTML=`<div class="sumchips"><span class="tag">${esc(name)}</span><span class="tag">${total} linhas</span><span class="st ok">${ok.length} válidas</span><span class="st ${bad?"wip":"lk"}">${bad} com erro</span></div>
  ${err.length?`<div class="panel tblwrap" style="margin-bottom:14px"><table class="errs"><thead><tr><th>Linha</th><th>Campo</th><th>O que corrigir</th></tr></thead><tbody>${err.map(x=>`<tr><td>${x.l}</td><td><b style="font-weight:600">${esc(x.f)}</b></td><td>${esc(x.m)}</td></tr>`).join("")}</tbody></table></div>`:""}
  ${ok.length?`<div class="panel tblwrap"><table><thead><tr><th>Marca</th><th>Plataforma</th><th>Formato</th><th>Início</th><th>Origem</th></tr></thead><tbody>${ok.slice(0,5).map(c=>`<tr><td style="font-weight:600">${esc(c.bn)}</td><td>${c.plataforma}</td><td>${esc(c.formato)}</td><td>${fmtDt(c.data_inicio)}</td><td><span class="seal" data-o="${c.origem}" style="height:22px;font-size:11px" data-tip="${esc(c.fonte||c.metodo||"Sem fonte")}">${OL[c.origem]}</span></td></tr>`).join("")}</tbody></table></div>
  <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn pri" id="impadd">Adicionar ${ok.length} ao Radar</button><span class="t-sm muted" style="align-self:center">As linhas com erro ficam de fora. Corrige o ficheiro e volta a carregar.</span></div>`:`<p class="t-sm muted">Nenhuma linha válida para adicionar.</p>`}`}
function loadCSV(text,name){renderImp(validateCSV(text,name,targetId()))}
document.addEventListener("click",e=>{
 if(e.target.closest("#impsample")){loadCSV(CSVEX,"exemplo.csv");return}

["dragover","dragenter"].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over")}}));

function applyTheme(id,announce){const t=AG.temas.find(x=>x.id===id)||AG.temas[0],aa=ensureAA(t.cor),root=document.documentElement;
  root.style.setProperty("--brand",t.cor);root.style.setProperty("--brand-ink",aa.hex);APPTHEME=t.id;
  if(announce){const adj=aa.hex.toLowerCase()!==t.cor.toLowerCase();toast(adj?`${t.nome}: a cor tem ${nf(aa.before,1)}:1 de contraste com branco. Para texto e botões o Radar usa ${aa.hex} (${nf(aa.after,1)}:1), acima do mínimo AA de 4,5:1.`:`${t.nome}: contraste ${nf(aa.before,1)}:1, cumpre o mínimo AA de 4,5:1.`)}
  syncSettings();redrawCharts()}
let APPTHEME=null;
function setMode(m){document.documentElement.dataset.mode=m;syncSettings();redrawCharts()}
const isDark=()=>document.documentElement.dataset.mode==="dark";

function seguirTemaDoVisualizador(){

  const aplicar=()=>{const t=r.dataset.theme,dark=t==="dark"||(t!=="light"&&mq.matches);setMode(dark?"dark":"light")};
  aplicar();mq.addEventListener&&mq.addEventListener("change",aplicar);
  new MutationObserver(aplicar).observe(r,{attributes:true,attributeFilter:["data-theme"]})}

  if(a.id==="pistas"){const l=D.pistas.map(p=>`<li>${esc(p.titulo)}: <b>${STL[p.s].toLowerCase()}</b></li>`).join("");return`<ul style="padding-left:18px;display:grid;gap:6px">${l||"<li>Sem pistas esta semana.</li>"}</ul><p><button class="btn" data-go="acoes/pistas">Abrir as pistas</button></p>`}
  if(a.id==="quota"){const s=sov(Z),inc=incl().sort((x,y)=>s[y.id]-s[x.id]),m=me();return`<p>${esc(m.nome)} tem <b>${nf(s[m.id],1)}%</b> da quota de voz, em ${inc.findIndex(e=>e.cliente)+1}.º lugar entre ${inc.length} marcas. ${inc[0].cliente?"É a marca com mais voz.":`${esc(inc[0].nome)} lidera com ${nf(s[inc[0].id],1)}%.`}</p><div>${spark(range(Z-15,Z).map(w=>sov(w)[m.id]),300,44)}</div>${sl(["anuncios"])}<p><button class="btn" data-go="mercado/voz">Abrir a quota de voz</button></p>`}
  if(a.id==="conjunto"){const inc=incl().map(e=>e.nome).join(", "),sg=D.entidades.find(e=>e.sugerida);return`<p>O conjunto de ${esc(me().nome)} tem <b>${incl().length} marcas</b>: ${esc(inc)}. ${sg?`O Radar sugere ainda ${esc(sg.nome)}, que a equipa pode aceitar.`:""}</p>${sl(["anuncios"])}<p><button class="btn" data-go="mercado/voz">Abrir o conjunto competitivo</button></p>`}
  if(a.id==="lancou"){const l=D.sinais.filter(s=>s.categoria==="Lançamento");return l.length?`<ul style="padding-left:18px;display:grid;gap:6px">${l.map(s=>`<li><b>${esc(s.titulo)}</b>. ${esc(s.leitura)}</li>`).join("")}</ul>${sl(["anuncios"])}<p><button class="btn" data-go="criativos">Ver criativos</button></p>`:`<p>Nenhum lançamento acima do limiar nas últimas semanas.</p>${sl(["anuncios"])}`}
  if(a.id==="pico"){const v=a.s.valores,mx=Math.max(...v.filter(x=>x!=null)),i=v.indexOf(mx);return`<p>O valor mais alto de «${esc(a.s.nome)}» é ${i===Z?"o desta semana, ":"o da semana de "}<b>${wLab(i)}</b>: ${mx} em 100.</p>${sl(["procura"])}<p><button class="btn" data-go="procura">Abrir Procura e notícias</button></p>`}
  if(a.it){const it=a.it;return`<p><b>${esc(it.rotulo)}</b>: ${nf(it.valor,it.decimais||0)}${esc(it.formato||"")}. ${esc(it.detalhe||"")}</p>${sl([it.bloco])}<p><button class="btn" data-go="mercado/ctx">Abrir o contexto de mercado</button></p>`}
  return`<p>Nesta pré-visualização só respondo às perguntas sugeridas. Na versão real, a pergunta traduz-se numa consulta aos dados recolhidos, e a resposta traz sempre a origem de cada número.</p>`}

/* ---------- Comandos ---------- */
function comandos(){
  const L=[],cli=ROUTE.scope==="cliente";
  if(cli){
    Object.entries(PAGES).filter(([k,p])=>!p.if||p.if()).forEach(([k,p])=>L.push({g:"Ir para",t:p.n,i:p.i,k:"abrir página",run:()=>go(`${CID}/${k}`)}));
    mtabs().forEach(x=>L.push({g:"Ir para",t:"Mercado: "+x[1],i:"i-layers",k:"abrir",run:()=>go(`${CID}/mercado/${x[0]}`)}));
    L.push({g:"Ir para",t:"Relatórios: publicar para o cliente",i:"i-send",k:"publicar vista cliente",run:()=>go(`${CID}/relatorios/publicar`)});
  }
  Object.entries(AGPAGES).forEach(([k,p])=>L.push({g:"Ir para",t:p.n,i:p.i,k:"agência",run:()=>go(`agencia/${k}`)}));
  AG.clientes.forEach(c=>L.push({g:"Mudar de cliente",t:c.nome,i:"i-radar",k:`${c.vertical_nome} cliente`,run:()=>go(`${c.id}/${cli&&ROUTE.page!=="criativos"?ROUTE.page:"visao"}`)}));
  L.push({g:"Ações",t:"Alternar modo claro e escuro",i:isDark()?"i-sun":"i-moon",k:"tema aparência",run:()=>setMode(isDark()?"light":"dark")});
  if(tourSteps().length)L.push({g:"Ações",t:"Apresentar: roteiro guiado",i:"i-play",k:"demonstração modo apresentação",run:()=>tourStart()});
  if(cli){L.push({g:"Ações",t:"Pré-visualizar a vista do cliente",i:"i-eye",k:"cliente publicar",run:()=>go(`${CID}/${ROUTE.page==="acoes"?"visao":ROUTE.page}?v=cliente`)});
    L.push({g:"Ações",t:"Simular semana sem sinais",i:"i-flask",k:"demonstração vazio",run:()=>{S.bquiet=!S.bquiet;CUR.refresh()}})}
  L.push({g:"Ações",t:"Repor demonstração",i:"i-x",k:"limpar decisões publicações",run:()=>resetEstado()});
  if(cli)ask.list.forEach(a=>L.push({g:"Perguntas",t:a.q,i:"i-search",k:"pergunta radar",run:()=>runAsk(a.id)}));
  return L}

const ask={el:$("#ask"),inp:$("#askin"),list:[],items:[],sel:0};
function palRender(){
  const q=norm(ask.inp.value.trim()),all=comandos(),words=q.split(/\s+/).filter(Boolean);
  let it=all.filter(c=>!words.length||words.every(w=>norm(c.t+" "+(c.k||"")+" "+c.g).includes(w)));
  if(!words.length)it=it.filter(c=>c.g!=="Mudar de cliente"||AG.clientes.length<=6).slice(0,14);else it=it.slice(0,10);
  if(!it.length&&q)it=[{g:"Perguntar",t:"Perguntar ao Radar: «"+ask.inp.value.trim()+"»",i:"i-search",run:()=>runAsk("x",ask.inp.value.trim())}];
  ask.items=it;ask.sel=Math.min(ask.sel,Math.max(0,it.length-1));
  let g="";$("#asksug").innerHTML=it.map((c,i)=>{const h=c.g!==g?`<div class="gh">${esc(c.g)}</div>`:"";g=c.g;return`${h}<button role="option" data-cmd="${i}" aria-selected="${i===ask.sel}"><svg class="ic" style="color:var(--text-2)"><use href="#${c.i}"/></svg>${esc(c.t)}</button>`}).join("");
  const sel=$('#asksug [aria-selected="true"]');if(sel)sel.scrollIntoView({block:"nearest"})}
function openAsk(pre){if(VIEW==="cliente")return;ask.list=ROUTE.scope==="cliente"?asks():[];ask.el.classList.add("on");$("#ans").hidden=true;$("#asksug").hidden=false;ask.inp.value="";ask.sel=0;palRender();setTimeout(()=>ask.inp.focus(),30);if(pre)runAsk(pre)}
function closeAsk(){ask.el.classList.remove("on")}
function runAsk(id,text){const a=ask.list.find(x=>x.id===id),q=text||(a?a.q:id);$("#asksug").hidden=true;const box=$("#ans");box.hidden=false;
  const type=(t,i=0)=>{ask.inp.value=t.slice(0,i);if(i<t.length&&!RM)setTimeout(()=>type(t,i+1),14);else ask.inp.value=t};type(q);
  box.innerHTML=`<div class="q">${esc(q)}</div><div class="dots" aria-label="A pensar"><i></i><i></i><i></i></div>`;
  setTimeout(()=>{box.innerHTML=`<div class="q">${esc(q)}</div><div class="ansbody">${answer(a||{id:"x"})}</div>`},RM?0:q.length*14+650)}
function palExec(i){const c=ask.items[i];if(!c)return;if(c.g==="Perguntas"||c.g==="Perguntar"){c.run();return}closeAsk();c.run()}
$("#askopen").addEventListener("click",()=>openAsk());
$("#askclose").addEventListener("click",closeAsk);
ask.el.addEventListener("click",e=>{if(e.target===ask.el)closeAsk();const c=e.target.closest("[data-cmd]");if(c){palExec(+c.dataset.cmd);return}const g=e.target.closest("[data-go]");if(g){closeAsk();go(g.dataset.go)}});
ask.inp.addEventListener("input",()=>{$("#ans").hidden=true;$("#asksug").hidden=false;ask.sel=0;palRender()});
ask.inp.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();ask.sel=Math.min(ask.items.length-1,ask.sel+1);palRender()}
  else if(e.key==="ArrowUp"){e.preventDefault();ask.sel=Math.max(0,ask.sel-1);palRender()}
  else if(e.key==="Enter"){e.preventDefault();if(!$("#asksug").hidden)palExec(ask.sel);else{const v=ask.inp.value.trim();if(v){const m=ask.list.find(a=>a.k.test(v));runAsk(m?m.id:"x",v)}}}});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();ask.el.classList.contains("on")?closeAsk():openAsk()}if(e.key==="Escape")closeAsk()});

/* ============================================================
   Modo apresentação: roteiro guiado (config/roteiro.yaml) com notas por ecrã, letra maior e menos distrações.
   Serve para apresentar o Radar à direção ou à equipa. Setas esquerda/direita avançam e recuam.
   Os passos «preparar» só existem para a demonstração e podem ser repostos (Repor demonstração).
   ============================================================ */
const TOUR={on:false,i:0};
const tourSteps=()=>AG.roteiro||[];
const hoje=()=>new Date().toISOString().slice(0,10);

/* Repor o estado da equipa (decisões e publicações) para recomeçar a demonstração */
function resetEstado(){
  try{localStorage.removeItem(STKEY)}catch(e){}
  Object.values(CLS).forEach(d=>{d.pistas.forEach(p=>{p.s="sugerida";p.cli=false;p.res=false;p.acao=p.acao0;p.para=p.para0});d.pub={publicada:false,paginas:[...PAGINAS_CLIENTE],cartoes:[],nota:"",quando:null}});
  Object.values(SESS).forEach(s=>{s.bquiet=false;s.bmode="equipa"});
  toast("Demonstração reposta: pistas por decidir e nada publicado.");CUR.refresh()}

function tourPreparar(cid,tipo){
  const d=CLS[cid];if(!d||!tipo)return;
  if(tipo==="demo-pistas"){const p=d.pistas[0];if(p){p.s="aceite";p.cli=true}d.pub.cartoes=d.sinais.slice(0,2).map(s=>s.id)}
  if(tipo==="demo-publicar"){d.pub.publicada=true;d.pub.quando=hoje()}
  saveState()}
function tourRender(){
  const st=tourSteps(),s=st[TOUR.i],n=st.length,last=TOUR.i===n-1,t=$("#tour");
  t.innerHTML=`<div class="tour-in"><span class="tn">${TOUR.i+1}/${n}</span><div class="tt"><b>${esc(s.titulo)}</b><span>${esc(s.nota)}</span></div><div class="tb"><button class="btn" id="tprev" ${TOUR.i?"":"disabled"} aria-label="Passo anterior"><svg class="ic" style="transform:rotate(180deg)"><use href="#i-chev"/></svg></button><button class="btn pri" id="tnext">${last?"Terminar":"Seguinte"}<svg class="ic"><use href="#i-chev"/></svg></button><button class="btn ghost" id="treset" title="Repor decisões e publicações">Repor</button><button class="iconbtn" id="tclose" aria-label="Sair do modo apresentação" style="border:0;background:none;color:#fff"><svg class="ic"><use href="#i-x"/></svg></button></div></div>`}
function tourGo(i){
  const st=tourSteps();if(!st.length)return;TOUR.i=clamp(i,0,st.length-1);const s=st[TOUR.i],cid=s.rota.split("/")[0];
  tourPreparar(cid,s.preparar);
  go(s.rota+(s.rota.includes("?v=")||s.rota.startsWith("agencia")?"":"?v=equipa"));
  tourRender()}
function tourStart(){if(!tourSteps().length)return;TOUR.on=true;document.documentElement.dataset.present="1";$("#tour").hidden=false;tourGo(0);setTimeout(redrawCharts,50)}
function tourStop(){TOUR.on=false;delete document.documentElement.dataset.present;$("#tour").hidden=true;setTimeout(redrawCharts,50)}
document.addEventListener("click",e=>{
  if(e.target.closest("#presbtn")){TOUR.on?tourStop():tourStart();return}
  if(!TOUR.on)return;
  if(e.target.closest("#tnext")){TOUR.i>=tourSteps().length-1?tourStop():tourGo(TOUR.i+1);return}
  if(e.target.closest("#tprev")){tourGo(TOUR.i-1);return}
  if(e.target.closest("#treset")){resetEstado();return}
  if(e.target.closest("#tclose"))tourStop()});
document.addEventListener("keydown",e=>{if(!TOUR.on||e.target.closest("input,textarea,select,svg,[contenteditable]"))return;
  if(e.key==="ArrowRight"){e.preventDefault();TOUR.i>=tourSteps().length-1?tourStop():tourGo(TOUR.i+1)}
  if(e.key==="ArrowLeft"){e.preventDefault();tourGo(TOUR.i-1)}});

/* ============================================================
   Aplicação: rotas, seletor de âmbito (Agência › Vertical › Cliente), menu único, Pergunta ao Radar, temas e arranque.
   Rotas: #/<cliente>/<página>[/<separador>][#<foco>]  ·  #/agencia/<torre|fontes>

  acoes:{n:"Ações",i:"i-spark",f:pageAcoes}};
const AGPAGES={torre:{n:"Torre de controlo",i:"i-grid",f:pageTorre},fontes:{n:"Fontes de dados",i:"i-plug",f:pageFontes}};
let ROUTE={scope:"cliente",view:"equipa",cid:null,page:"visao",sub:null,focus:null};

function pageClienteVazio(){return pheadHTML(`${esc(D.cliente.nome)} · vista do cliente`,"Ainda não há relatório publicado","A equipa Arena ainda não publicou o relatório desta semana. Nada é mostrado ao cliente sem essa decisão.")+`<div class="empty"><svg class="ic"><use href="#i-lock"/></svg><div><b>Sem publicação</b><br>Prepara o que o cliente vê em Relatórios, «Publicar para o cliente». <button class="btn" style="margin-left:8px" data-go="${D.cliente.id}/relatorios/publicar?v=equipa">Preparar publicação</button></div></div>`}

/* ---------- Menu único (o mesmo para todos os clientes) e seletor de âmbito ---------- */
function buildNav(){
  const cli=ROUTE.scope==="cliente";
  const item=(id,p,on,href,cnt)=>`<button class="nv" data-go="${href}" aria-current="${on}"><svg class="ic"><use href="#${p.i}"/></svg><span class="lg">${p.n}</span><span class="sh">${p.s||p.n}</span>${cnt?`<span class="cnt" id="navcnt" ${pistasPend(D)?"":"hidden"}>${pistasPend(D)}</span>`:""}</button>`;
  if(VIEW==="cliente"&&cli){$("#nav").innerHTML=`<div class="grp">${esc(D.cliente.nome)}</div>`+paginasCliente().map(k=>item(k,PAGES[k],ROUTE.page===k,`${D.cliente.id}/${k}`,false)).join("");return}
  $("#nav").innerHTML=`<div class="grp">${esc(D.cliente.nome)}</div>`+Object.entries(PAGES).filter(([k,p])=>!p.if||p.if()).map(([k,p])=>item(k,p,cli&&ROUTE.page===k,`${D.cliente.id}/${k}`,k==="acoes")).join("")+
   `<div class="grp">Agência</div>`+Object.entries(AGPAGES).map(([k,p])=>item(k,p,!cli&&ROUTE.page===k,`agencia/${k}`,false)).join("")}
let MENU=null;

  $("#scope").innerHTML=`<button class="sc ${cli?"":"cur"}" data-go="agencia/torre">Agência</button><span class="sep">/</span>`+
   (cli?`<button class="sc" data-menu="vert">${esc(D.cliente.vertical_nome)}<svg class="ic"><use href="#i-down"/></svg></button><span class="sep">/</span><button class="sc cur" data-menu="cli">${esc(D.cliente.nome)}<svg class="ic"><use href="#i-down"/></svg></button><span class="sep">/</span><span class="sc cur pg" style="cursor:default">${esc((PAGES[ROUTE.page]||{n:""}).n)}</span>`
       :`<span class="sc cur" style="cursor:default">${esc((AGPAGES[ROUTE.page]||{n:""}).n)}</span>`)}

    :AG.verticais.map(v=>`<div class="gh">${esc(v.nome)}</div>`+v.clientes.map(id=>btn_({id,t:CLS[id].cliente.nome+(CLS[id].cliente.ficticio?" (fictício)":""),on:id===D.cliente.id})).join("")).join("");

document.addEventListener("click",e=>{const b=e.target.closest("[data-menu]");if(b){e.stopPropagation();MENU&&MENU.dataset.k===b.dataset.menu?closeMenu():(openMenu(b.dataset.menu,b),MENU.dataset.k=b.dataset.menu);return}
  const s=e.target.closest("[data-switch]");if(s){closeMenu();const pg=ROUTE.scope==="cliente"?ROUTE.page:"visao";go(s.dataset.switch+"/"+(pg==="criativos"&&!CLS[s.dataset.switch].anuncios?"visao":pg));return}
  if(!e.target.closest("#menu"))closeMenu()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});

/* ---------- Router ---------- */
function parse(hash){
  const h=(hash||"").replace(/^#\/?/,""),[pth,focus]=h.split("#"),[path,q]=pth.split("?"),p=path.split("/").filter(Boolean),view=/(^|&)v=cliente/.test(q||"")?"cliente":"equipa";
  if(p[0]==="agencia")return{scope:"agencia",view:"equipa",cid:CID,page:AGPAGES[p[1]]?p[1]:"torre",sub:null,focus};
  if(p[0]&&CLS[p[0]])return{scope:"cliente",view,cid:p[0],page:PAGES[p[1]]?p[1]:"visao",sub:p[2]||null,focus};
  return{scope:"cliente",view:"equipa",cid:CID||AG.cliente_inicial||AG.clientes[0].id,page:"visao",sub:null,focus:null}}
function href(r){return r.scope==="agencia"?"#/agencia/"+r.page:`#/${r.cid}/${r.page}${r.sub?"/"+r.sub:""}${r.view==="cliente"?"?v=cliente":""}${r.focus?"#"+r.focus:""}`}
function go(path){
  const first=path.split(/[\/#]/)[0];
  if(first!=="agencia"&&!CLS[first])path=CID+"/"+path;      // relativo ao cliente ativo
  const r=parse("#/"+path);
  if(!/\?v=/.test(path))r.view=r.scope==="cliente"?VIEW:"equipa";      // a vista mantém-se ao navegar
  if(href(r)===location.hash&&!r.focus){render(r,false);return}
  try{history.pushState(null,"",href(r))}catch(e){}render(r,true)}
addEventListener("popstate",()=>render(parse(location.hash),true));
addEventListener("hashchange",()=>{const r=parse(location.hash);if(!ROUTE||href(r)!==href(ROUTE))render(r,true)});
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(!g||!g.dataset.go||g.closest("#ask"))return;if(g.tagName==="A")e.preventDefault();go(g.dataset.go)});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".kpi[data-go]")){e.preventDefault();go(e.target.dataset.go)}});

render.n=0;
function render(r,scrollTop){
  stopRace();stopPlay();closeDrawer();closeMenu();closeFpop();$("#pop").classList.remove("on");CHARTS.length=0;AFTER.length=0;USED.clear();SEAL_OV=null;SEAL_HIDE=false;
  if(r.cid){CID=r.cid}if(!D||D.cliente.id!==CID)setClient(CID);else if(!S)setClient(CID);
  VIEW=r.view;document.documentElement.dataset.view=VIEW;
  let pg;
  if(r.scope==="agencia")pg=AGPAGES[r.page];
  else if(VIEW==="cliente"){            // o cliente só vê o que a equipa publicou
    const al=paginasCliente();
    if(!al.length){r={...r,page:"visao",sub:null};pg=PAGE_CLI_VAZIO}
    else{if(!al.includes(r.page))r={...r,page:al[0],sub:null};pg=PAGES[r.page]}}
  else{pg=PAGES[r.page];if(pg.if&&!pg.if()){r={...r,page:"visao"};pg=PAGES.visao}}
  ROUTE=r;
  const th=VIEW+"|"+CID;if(th!==render.th){render.th=th;const tid=VIEW==="cliente"&&D.cliente.tema&&AG.temas.some(x=>x.id===D.cliente.tema)?D.cliente.tema:AG.temas[0].id;applyTheme(tid,false)}   // tema do cliente só na vista do cliente (Q09)
  const t=$("#page");t.classList.remove("on");
  const banner=VIEW==="cliente"&&r.scope==="cliente"?`<div class="vbanner no-print"><span><b>Pré-visualização da vista do cliente.</b> É assim que o cliente vê o que a equipa publicou. Nada sai da agência sem publicação.</span><button class="btn" data-go="${D.cliente.id}/${r.page==="vazio"?"visao":r.page}?v=equipa">Voltar à vista Equipa</button></div>`:"";
  const html=banner+pg.f(r.sub,r.focus);t.innerHTML=html;t.classList.add("on");
  buildNav();buildScope();$("#viewseg").hidden=r.scope==="agencia";$$("#viewseg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===VIEW));
  document.title="Arena Radar, "+(r.scope==="agencia"?pg.n:D.cliente.nome+", "+pg.n+(VIEW==="cliente"?" (vista do cliente)":""));
  CUR.refresh=()=>{const y=scrollY;stopRace();stopPlay();CHARTS.length=0;AFTER.length=0;USED.clear();SEAL_OV=null;SEAL_HIDE=false;const h=(banner||"")+pg.f(r.sub,r.focus);$("#page").innerHTML=h;buildNav();buildScope();AFTER.forEach(f=>f());AFTER.length=0;counters($("#page"));scrollTo({top:y,behavior:"auto"});fpopSync()};
  AFTER.forEach(f=>f());AFTER.length=0;counters(t);syncCounts();
  if(scrollTop&&!r.focus)scrollTo({top:0,behavior:"auto"});
  const h1=$("h1",t);if(h1&&scrollTop){h1.tabIndex=-1;if(render.n++)h1.focus({preventScroll:true})}
  const lv=$("#live");if(lv)lv.textContent=document.title;
  if(location.hash!==href(r)){try{history.replaceState(null,"",href(r))}catch(e){}}}

document.addEventListener("click",e=>{if(e.target.closest("[data-skip]")){e.preventDefault();const h=$("#page h1");h&&h.focus()}});
document.addEventListener("click",e=>{const b=e.target.closest("#viewseg [data-view]");if(!b)return;const pg=ROUTE.scope==="cliente"&&ROUTE.page!=="acoes"?ROUTE.page:"visao";go(`${CID}/${pg}?v=${b.dataset.view}`)});

/* ---------- Arranque ---------- */
function start(){
  if(EM_ARTEFACTO)seguirTemaDoVisualizador();
  applyTheme(AG.temas[0].id,false);
  const r=parse(location.hash);CID=r.cid||AG.cliente_inicial||AG.clientes[0].id;setClient(CID);render(r,true)}
const sp=$("#splash");let seen=false;try{seen=sessionStorage.getItem("radar-intro")==="1"}catch(e){}
if(RM||seen||location.search.includes("nosplash")){sp.remove();start()}
else{start();const end=()=>{sp.classList.add("out");setTimeout(()=>sp.remove(),600);try{sessionStorage.setItem("radar-intro","1")}catch(e){}};setTimeout(end,2300);sp.addEventListener("click",end)}

})();
</script>
