<div class="app">
  <aside class="side" aria-label="Navegação principal">
    <div class="brandrow"><span class="logo-tile"><img id="logo" alt="Arena Media" src="data:image/jpeg;base64,{{LOGO_B64}}"></span><div><b>Arena Radar</b><span>Radar de movimentos</span></div></div>
    <nav id="nav"></nav>
    <div class="sidefoot"><b>A plataforma sugere.</b>A equipa decide o que fazer e o que leva ao cliente.</div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="scope" id="scope" role="group" aria-label="Âmbito"></div>
      <span class="sp"></span>
      <button class="btn sm" id="tourbtn" aria-pressed="false"><svg class="ic"><use href="#i-play"/></svg><span class="lg">Demonstração</span></button>
      <button class="iconbtn" id="modebtn" aria-label="Mudar entre modo claro e escuro"><svg class="ic"><use href="#i-moon"/></svg></button>
    </header>
    <main id="page" aria-label="Conteúdo"></main>
  </div>
</div>
<div id="scrim"></div>
<aside id="drawer" aria-label="Detalhe" aria-hidden="true"></aside>
<div id="pop" role="dialog" aria-label="Origem dos dados"></div>

<div id="tourbar" role="region" aria-label="Roteiro da demonstração"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="live" class="sr" aria-live="polite"></div>
