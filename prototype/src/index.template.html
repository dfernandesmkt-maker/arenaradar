<!doctype html>
<html lang="pt-PT" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Arena Radar</title>
<style>
@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url(data:font/woff2;base64,{{FONT_B64}}) format("woff2")}
{{INCLUDE:css/app.css}}
{{INCLUDE:css/charts.css}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h6.5v6.5H4zM13.5 4H20v6.5h-6.5zM4 13.5h6.5V20H4zM13.5 13.5H20V20h-6.5z"/></symbol>
    <symbol id="i-radar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l5.6-5.6"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/><path d="M18.5 16.5v4M16.5 18.5h4"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7.5l8.5 6 8.5-6"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3.5 20.5h17M6 16l4-5 3.2 3 5-7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 5.5v13M15.5 5.5v13"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1-4.2L16.5 4.3a2 2 0 012.8 0l.4.4a2 2 0 010 2.8L8.2 19z"/></symbol>
    <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3.5h6M10 3.5v5.8L4.8 18a2 2 0 001.7 3h11a2 2 0 001.7-3L14 9.3V3.5"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3L10.5 13.5M21 3l-6.5 18-4-7.5L3 9.5z"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5.5l6.5 6.5L9 18.5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3.5v5M15 3.5v5M6.5 8.5h11v3.5a5.5 5.5 0 01-11 0zM12 17.5v3"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 8V3.5h10V8M7 17H4.5v-7.5h15V17H17M7 14.5h10V21H7z"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3.5l9 5-9 5-9-5zM3 12.5l9 5 9-5M3 16.5l9 5 9-5"/></symbol>
    <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3.5 17l5-5.5 4 3.5 7.5-8.5M15 6.5h5v5"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 011 1v15l-6-4-6 4V5a1 1 0 011-1z"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.2"/><path d="M15.5 8.5V6.2a1.7 1.7 0 00-1.7-1.7H6.2a1.7 1.7 0 00-1.7 1.7v7.6a1.7 1.7 0 001.7 1.7h2.3"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M4 17.5l5-4.5 4 3.5 3-2.5 4.5 3.5"/></symbol>
  </defs>
</svg>

<div id="splash" aria-hidden="true">
  <div class="in">
    <svg viewBox="-150 -150 300 300">
      <defs><linearGradient id="spg" gradientUnits="userSpaceOnUse" x1="-77" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#328CF5" stop-opacity="0"/><stop offset="1" stop-color="#328CF5" stop-opacity=".42"/></linearGradient></defs>
      <circle class="rg" r="40"/><circle class="rg" r="80"/><circle class="rg" r="120"/>
      <path class="rg" d="M0-120V120M-120 0H120"/>
      <g id="spsweep"><path d="M0 0L-77.1-91.9A120 120 0 0 1 0-120Z" fill="url(#spg)"/><line x1="0" y1="0" x2="0" y2="-120" stroke="#328CF5" stroke-width="2"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.3s" repeatCount="1.6" fill="freeze"/></g>
      <g class="bl" style="animation-delay:.25s"><circle cx="45" cy="-62" r="6" fill="#FFDC32" stroke="#0F2623" stroke-width="2"/></g>
      <g class="bl" style="animation-delay:.7s"><circle cx="40" cy="48" r="5" fill="#328CF5"/></g>
      <g class="bl" style="animation-delay:1.1s"><circle cx="-70" cy="-30" r="5" fill="#328CF5"/></g>
    </svg>
    <div class="sp-t"><b>Arena Radar</b><span>A plataforma sugere. A equipa decide.</span></div>
  </div>
</div>

<a class="skip" href="#page" data-skip>Saltar para o conteúdo</a>
<div class="app">
  <aside class="side" aria-label="Navegação principal">
    <div class="brandrow"><span class="logo-tile"><img alt="Arena Media" src="data:image/jpeg;base64,{{LOGO_B64}}"></span><b>Arena Radar</b></div>
    <nav id="nav"></nav>
    <div class="legend"><p>A plataforma sugere.</p><div><span>A equipa decide o que fazer e o que leva ao cliente.</span></div></div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="scope" id="scope" aria-label="Âmbito"></div>
      <button class="askbtn" id="askopen" aria-label="Pergunta ao Radar"><svg class="ic"><use href="#i-search"/></svg><span>Pergunta ao Radar</span><kbd>Ctrl K</kbd></button>
      <div class="tools">
        <button class="btn" id="presbtn" aria-label="Modo apresentação"><svg class="ic"><use href="#i-play"/></svg><span>Apresentar</span></button>
        <div class="seg" id="viewseg" role="group" aria-label="Vista"><button data-view="equipa" aria-pressed="true">Equipa</button><button data-view="cliente" aria-pressed="false">Cliente</button></div>
        <button class="iconbtn" id="setbtn" aria-label="Definições" aria-haspopup="dialog" aria-expanded="false"><svg class="ic"><use href="#i-sliders"/></svg></button>
      </div>
    </header>
    <main id="page" aria-label="Conteúdo"></main>
    <div id="live" class="sr" aria-live="polite" aria-atomic="true"></div>
  </div>
</div>

<div id="ask" role="dialog" aria-modal="true" aria-label="Pergunta ao Radar">
  <div class="askbox">
    <div class="askin"><svg class="ic" style="color:var(--text-2)"><use href="#i-search"/></svg><input id="askin" placeholder="Escreve um comando ou uma pergunta" role="combobox" aria-expanded="true" aria-controls="asksug" autocomplete="off"><button class="iconbtn" id="askclose" aria-label="Fechar" style="width:30px;height:30px;border:0"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div class="askbody"><div class="sug" id="asksug" role="listbox"></div><div class="ans" id="ans" hidden></div></div>
  </div>
</div>
<div id="scrim"></div>
<aside id="drawer" aria-label="Detalhe"></aside>
<div id="tour" hidden role="region" aria-label="Roteiro da apresentação"></div>
<div id="pop" role="dialog" aria-label="Origem dos dados"></div>
<div id="tip" role="tooltip"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script type="application/json" id="radar-data">{{DATA_JSON}}</script>
<script>
(()=>{
"use strict";
{{INCLUDE:js/00-core.js}}

{{INCLUDE:js/80-settings.js}}
{{INCLUDE:js/82-palette.js}}
{{INCLUDE:js/85-tour.js}}
{{INCLUDE:js/90-app.js}}
})();
</script>
</body>
</html>
